# กดเครื่องหมาย + หน้า R14.1 รายงานกลุ่มวันหมดอายุ เพื่อขยายดูรายงานย่อย
#
# รายการรายงานทางซ้ายเป็น DataWindow control_id=1010 (จอ 9,112 ขนาด 405x916)
# วัดจากภาพหน้าจอแล้วได้สูตรพิกัดในระบบของ DataWindow ดังนี้
#
#     x = 16            กล่องเครื่องหมาย + (ปุ่มขยาย)
#     x = 80 ขึ้นไป      ตัวข้อความ (ใช้เมื่อจะเลือกแถว ไม่ใช่ขยาย)
#     y = 8 + 27 * ลำดับแถว     (ลำดับแถวเริ่มนับ 0 ทุกแถวสูง 27px เท่ากันเป๊ะ)
#
# ลำดับแถวตอนที่ยังไม่มีแถวไหนถูกขยาย (วัดจากภาพ 2026-10-06)
#     0 R01.1   1 R01.2   2 R01.3   3 R16.1   4 R02.1   5 R02.2
#     6 R03.1   7 R04.1   8 R04.2   9 R04.3  10 R04.4  11 R05.1
#    12 R06.1  13 R06.2  14 R06.3  15 R06.4  16 R06.5  17 R07.1
#    18 R08.1  19 R09.1  20 R10.1  21 R11.1  22 R12.1  23 R13.1
#    24 R14.1  25 R15.1  26 R16.1  27 R17.1 ...
#
# แถว 3 "R16.1 ปรับขนาด-เพิ่มเติม" เป็นแถวซ้ำที่โผล่มาใหม่ (ตัวจริงอยู่แถว 26 ตามเดิม)
#
# นับลำดับแถวจากเลขรายงานตรง ๆ จะผิด -- เลขรายงานไม่ต่อเนื่องเสมอไป และ SeniorSoft
# แทรกรายงานใหม่เข้ามาเป็นระยะ เจอแล้ว 2 ครั้ง
#     2026-09  เพิ่ม R06.5 กับ R07.1 ทำให้ทุกแถวตั้งแต่ R08.1 เลื่อนลง 2 ตำแหน่ง
#     2026-10  เพิ่ม R16.1 ซ้ำที่แถว 3 ทำให้ทุกแถวตั้งแต่ R02.1 เลื่อนลง 1 ตำแหน่ง
#              บอทกด + โดน R13.1 แทน R14.1 แล้วเปิด R13.102 แทน R14.102
#              (assert_text ใน r14_102.yaml จับได้ ไม่มีไฟล์ผิดหลุดออกไป)
# ถ้าบอทจู่ ๆ กดเมนูผิด ให้สงสัยก่อนว่าเมนูมีแถวใหม่แทรกเข้ามาอีกหรือเปล่า
# วัดพิกัดใหม่จากภาพ 01_before_expand ใน screenshots/
#
# ระวัง: พอขยายแถวไหนแล้ว แถวที่อยู่ใต้ลงไปจะเลื่อนลง สูตรนี้ใช้ไม่ได้อีก
#        ถ้าจะคลิกอะไรต่อ ต้องวัดพิกัดใหม่จากภาพ 02_after_expand

name: r14_1
description: ล็อกอินแล้วกด + หน้า R14.1 รายงานกลุ่มวันหมดอายุ
on_error: abort

steps:
  - action: run_flow
    name: เข้าสู่ระบบ
    path: flows/login.yaml

  - action: wait_window
    name: จับหน้าจอหลักไว้อ้างอิง
    as: main
    timeout: 60
    window:
      class_name: "FNWND3125"
      title: "Report Seniorsoft ProMaxx"

  - action: screenshot
    name: 01_before_expand
    window: main

  # แถวที่ 24 -> y = 8 + 27*24 = 656
  #
  # change_region ตรวจเฉพาะพื้นที่ใต้แถวที่กด เพื่อแยก "ขยายสำเร็จ" (แถวข้างล่าง
  # เลื่อนลงทั้งแผง) ออกจาก "แค่เลือกแถว" (สีเปลี่ยนเฉพาะแถวนั้น) ซึ่งเป็นอาการ
  # ของการคลิกพลาดเป้า
  #
  # ต้องเว้นอย่างน้อย 1 แถวเต็ม (27px) จากจุดที่คลิก -- วัดจริงแล้วพบว่าแถบไฮไลต์
  # ของแถวที่ถูกเลือกลากยาวลงไปถึง y = จุดคลิก + 16 ถ้าตั้ง top ชิดกว่านี้
  # การเลือกแถวเฉย ๆ จะถูกนับว่า "เปลี่ยนแล้ว" กลายเป็นผลบวกลวง
  - action: dw_click
    name: กด + หน้า R14.1 รายงานกลุ่มวันหมดอายุ
    window: main
    datawindow: { class_name: "pbdw125", control_id: 1010 }
    at: { x: 16, y: 656 }
    expect_change: true
    change_region: { top: 683 }     # 656 + 27
    change_timeout: 5

  - action: screenshot
    name: 02_after_expand
    window: main
