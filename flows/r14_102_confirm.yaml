# กดปุ่ม "ตกลง" ในหน้าต่างเงื่อนไขการสร้างรายงาน เพื่อออกรายงาน R14.102 จริง
#
# เงื่อนไขที่ตั้งไว้ใน flow ชั้นก่อนหน้า
#     คลังสินค้า   อนิน สาขาแยกชากค้อ (Warehouse, Front Store) / เก้ากิโล / อนิน สาขาสวนเสือศรีราชา
#     วันที่       ประจำปี-ช่วงปี 2023-2026
#     สินค้า       สินค้าทั้งหมด (ค่าเริ่มต้น ไม่ได้แตะ)
#
# ปุ่มในหน้าต่างเงื่อนไข
#     { class_name: "Button", title: "ตกลง" }   ยืนยัน
#     { class_name: "Button", title: "ออก" }    ยกเลิก

name: r14_102_confirm
description: กดตกลงในหน้าเงื่อนไข เพื่อออกรายงาน R14.102
on_error: abort

steps:
  - action: run_flow
    name: ตั้งเงื่อนไขคลังและช่วงปีให้ครบ
    path: flows/r14_102_year.yaml

  - action: wait_window
    name: จับหน้าจอหลักไว้อ้างอิง
    as: main
    timeout: 60
    window:
      class_name: "FNWND3125"
      title: "Report Seniorsoft ProMaxx"

  - action: wait_window
    name: จับหน้าต่างเงื่อนไขไว้อ้างอิง
    as: cond
    timeout: 60
    window:
      class_name: "FNWNS3125"
      title: "เงื่อนไขการสร้างรายงาน"

  # ไม่ใช้ expect_change กับพื้นที่แสดงรายงาน (pbdw125 id=1007) เหมือน R05.106
  # เพราะรายงานนี้ใหญ่ (3,027 หน้า ใช้เวลาราว 44 วินาที) พอกดตกลง พื้นที่รายงานถูกล้าง
  # เป็นสีขาวก่อนเริ่มดึงข้อมูล การเทียบภาพจึงจับได้ตั้งแต่วินาทีแรกแล้วนับว่าผ่าน
  # ทั้งที่รายงานยังไม่ออก (ผลบวกลวง - ทดสอบแล้ว) ตัวยืนยันจริงอยู่ step ถัดไป
  - action: click
    name: กดปุ่มตกลง
    window: cond
    control: { class_name: "Button", title: "ตกลง" }
    method: message

  # abort_if ดักกล่องเตือนที่เด้งตอนกดตกลง ให้รู้ผลทันทีแทนที่จะรอจนหมดเวลา
  - action: wait_window_gone
    name: รอหน้าต่างเงื่อนไขปิด
    window: cond
    timeout: 60
    abort_if: { class_name: "#32770" }

  # สัญญาณว่ารายงานออกเสร็จจริง: แถบสรุปเงื่อนไขใต้รายงาน (Edit id=1004)
  # ถูกซ่อนและว่างตลอดตั้งแต่เปิดโปรแกรมจนระหว่างดึงข้อมูล แล้วโผล่พร้อมข้อความ
  # ตอนรายงานเสร็จเท่านั้น (จับลำดับเหตุการณ์จริงแล้ว: กดตกลง -> หน้าต่าง progress 274x50
  # โผล่ โปรแกรมหยุดตอบ message ราว 44 วินาที -> progress หาย + Edit 1004 โผล่พร้อมกัน)
  #
  # wait_control หา control ด้วยคลาสกับ id เท่านั้น ไม่ต้องส่ง message เข้าโปรแกรม
  # จึงรอได้แม้โปรแกรมกำลังยุ่ง เผื่อเวลาไว้ 10 นาทีเพราะข้อมูลช่วงปีจะโตขึ้นเรื่อย ๆ
  - action: wait_control
    name: รอจนรายงานออกเสร็จ (แถบสรุปเงื่อนไขใต้รายงานโผล่)
    window: main
    control: { class_name: "Edit", control_id: 1004 }
    state: visible
    timeout: 600

  # ยืนยันเชิงความหมาย: อ่านข้อความจากโปรแกรมตรง ๆ ว่ารายงานออกด้วยคลังและช่วงปีที่ตั้งไว้
  # คลังต้องเรียงติดกันครบ 4 ตัวนี้เท่านั้น ถ้ามีคลังอื่นหลุดเข้ามาจะไม่ผ่าน
  # ข้อความจริง (บรรทัดคั่นด้วย \r\n):
  #     คลังสินค้า : อนิน สาขาแยกชากค้อ:Warehouse,อนิน สาขาแยกชากค้อ:Front Store,
  #                  เก้ากิโล:Main KKL,อนิน สาขาสวนเสือศรีราชา:Main SSS
  #     ประจำปี : 2023-2026
  #     สินค้าทั้งหมด
  #     LOTNO ทั้งหมด
  # retry เผื่อกรณีโปรแกรมทำให้ช่องมองเห็นก่อนใส่ข้อความเสร็จเสี้ยววินาที
  - action: assert_text
    name: ยืนยันว่ารายงานใช้คลังและช่วงปีที่ตั้งไว้
    window: main
    control: { class_name: "Edit", control_id: 1004 }
    matches: "คลังสินค้า : อนิน สาขาแยกชากค้อ:Warehouse,อนิน สาขาแยกชากค้อ:Front Store,เก้ากิโล:Main KKL,อนิน สาขาสวนเสือศรีราชา:Main SSS\\s+ประจำปี : 2023-2026"
    retry: { times: 3, delay: 1 }

  - action: screenshot
    name: 01_report_result
    window: main
