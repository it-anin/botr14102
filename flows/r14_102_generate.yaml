# เปิดรายงาน R14.102 แล้วกดปุ่ม "สร้างรายงาน"
#
# ของในกรอบขวาเป็น control จริง จึงไม่ต้องใช้พิกัดเลย หา locator ด้วยข้อความได้
# แถบเครื่องมือมีปุ่มซ้ำที่ถูกซ่อนไว้ชื่อเดียวกัน แต่สเปกค้นหาตัดตัวที่มองไม่เห็น
# ออกอยู่แล้ว (visible ค่าเริ่มต้นเป็น true) จึงได้ปุ่มที่ถูกต้องเสมอ

#
# หน้าต่างเงื่อนไขที่เด้งขึ้นมา (FNWNS3125 title='เงื่อนไขการสร้างรายงาน')
#     pbdw125 id=1000              ฟอร์มเงื่อนไข (DataWindow วาดเอง ต้องคลิกพิกัด) มี 4 กลุ่ม
#         คลังสินค้า   ค่าเริ่มต้นเลือกไว้คลังเดียว "อนิน สาขาแยกชากค้อ:Warehouse"
#                     (ปุ่มดินสอข้าง ๆ = เปิดหน้าเลือกคลัง)
#         วันที่       ประจำวัน (ค่าเริ่มต้น = วันนี้) / ประจำวัน-ช่วงวัน และเวลา /
#                     ประจำเดือน-ช่วงเดือน / ประจำปี-ช่วงปี
#         สินค้า       สินค้าทั้งหมด (ค่าเริ่มต้น) / กลุ่มสินค้า / สินค้า
#         LotNo       ว่าง
#     { class_name: "Button", title: "ตกลง" }   ปุ่มยืนยัน
#     { class_name: "Button", title: "ออก" }    ปุ่มยกเลิก

name: r14_102_generate
description: เปิด R14.102 แล้วกดสร้างรายงาน จนได้หน้าต่างเงื่อนไข
on_error: abort

steps:
  - action: run_flow
    name: เปิดรายงาน R14.102
    path: flows/r14_102.yaml

  - action: wait_window
    name: จับหน้าจอหลักไว้อ้างอิง
    as: main
    timeout: 60
    window:
      class_name: "FNWND3125"
      title: "Report Seniorsoft ProMaxx"

  - action: wait_control
    name: รอให้ปุ่มสร้างรายงานพร้อมใช้งาน
    window: main
    control: { class_name: "Button", title: "สร้างรายงาน" }
    state: enabled
    timeout: 30

  # กดแล้วจะไม่ได้รายงานทันที แต่จะมีหน้าต่าง "เงื่อนไขการสร้างรายงาน" เด้งขึ้นมาก่อน
  # จึงไม่ใช้ expect_change (เทียบภาพ) แต่ใช้ wait_window รอหน้าต่างนั้นแทน
  # ซึ่งแน่นอนกว่าเพราะยึดจากชื่อหน้าต่างจริงที่โปรแกรมสร้าง
  - action: click
    name: กดปุ่มสร้างรายงาน
    window: main
    control: { class_name: "Button", title: "สร้างรายงาน" }
    method: message

  - action: wait_window
    name: รอหน้าต่างเงื่อนไขการสร้างรายงาน
    as: cond
    timeout: 60
    window:
      class_name: "FNWNS3125"
      title: "เงื่อนไขการสร้างรายงาน"
    abort_if: { class_name: "#32770" }

  - action: screenshot
    name: 01_condition_dialog
    window: cond

  - action: screenshot
    name: 02_full_screen
    window: main
