# เปิดรายงาน R14.102 รายงานสินค้าคงเหลือ เลือกแสดงตามวันรับเข้า (เรียงตามวันหมดอายุ)
#
# ต่อยอดจาก flows/r14_1.yaml (ล็อกอิน + ขยาย R14.1) ไม่ต้องเขียนซ้ำ
#
# ลำดับแถวหลังขยาย R14.1 แล้ว (y = 8 + 27 * ลำดับแถว)
# (พิกัดอ้างอิงลำดับแถวของ R14.1 เอง ไม่ใช่ค่าตายตัว -- ถ้าตำแหน่ง R14.1 ก่อนขยาย
# เปลี่ยนไป (ดู flows/r14_1.yaml) ต้องคำนวณชุดนี้ใหม่ทั้งหมดตามไปด้วย)
#     24 R14.1 (แม่ ตอนนี้เป็น -)  y=656
#     25 R14.101  y=683
#     26 R14.102  y=710   <- เป้าหมาย
#     27 R14.103  y=737
#     28 R14.104  y=764
#     29 R14.106  y=791
#     30 R14.107  y=818
#     31 R14.108  y=845
#     32 R14.111  y=872
#     33 R14.112  y=899
#     34 R15.1 (แถวแม่ถัดไป)  y=926
#
# เลขรายงานลูกไม่ต่อเนื่อง (ไม่มี R14.105 / R14.109 / R14.110) นับจากเลขตรง ๆ จะผิด
#
# พิกัดแนวนอนของแถวลูก
#     x = 53        ไอคอนดาว - ห้ามคลิก กดโดนจะเป็นการตั้ง/ยกเลิกรายการโปรด
#                   (R14.102 เป็นดาวทึบ = เป็นรายการโปรดอยู่แล้ว กดโดนจะถูกยกเลิก)
#     x = 68 ขึ้นไป  ตัวข้อความของรายงาน

name: r14_102
description: เปิดรายงาน R14.102 รายงานสินค้าคงเหลือ เลือกแสดงตามวันรับเข้า (เรียงตามวันหมดอายุ)
on_error: abort

steps:
  - action: run_flow
    name: ล็อกอินแล้วขยาย R14.1
    path: flows/r14_1.yaml

  - action: wait_window
    name: จับหน้าจอหลักไว้อ้างอิง
    as: main
    timeout: 60
    window:
      class_name: "FNWND3125"
      title: "Report Seniorsoft ProMaxx"

  # หน้าจอเงื่อนไขของรายงานโผล่ใน "กรอบขวา" ของหน้าต่างเดิม ไม่ใช่หน้าต่างใหม่
  # จึงต้องเฝ้าดูหน้าต่างหลักทั้งบาน แล้วตัดฝั่งซ้ายทิ้งด้วย change_region
  # (รายการรายงานจบที่ x=422 ในพิกัดภาพ ใช้ left: 440 เผื่อขอบ)
  #
  # ถ้าไม่ตัดฝั่งซ้าย แค่แถวถูกเลือกแล้วเปลี่ยนสีก็จะถูกนับว่า "คลิกสำเร็จ" ทันที
  # กลายเป็นผลบวกลวงที่ปิดบังกรณีคลิกพลาด
  - action: dw_click
    name: กดเมนู R14.102 รายงานสินค้าคงเหลือ เลือกแสดงตามวันรับเข้า (เรียงตามวันหมดอายุ)
    window: main
    datawindow: { class_name: "pbdw125", control_id: 1010 }
    at: { x: 150, y: 710 }          # แถวที่ 26 กลางข้อความ
    expect_change: true
    change_window: main
    change_region: { left: 440 }
    change_timeout: 30

  # ยืนยันแบบตรงตัว: แถบหัวเรื่องบนสุดเป็น Button จริงที่มีชื่อรายงานอยู่ข้างใน
  # แน่นอนกว่าการเทียบภาพ เพราะอ่านข้อความจากโปรแกรมโดยตรง
  - action: assert_text
    name: ยืนยันว่าเปิด R14.102 จริง
    window: main
    control: { class_name: "Button", control_id: 1011 }
    contains: "R14.102"

  - action: screenshot
    name: 01_r14_102_opened
    window: main
