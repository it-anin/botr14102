# กดปุ่มดินสอหลังชื่อคลัง "อนิน สาขาแยกชากค้อ:Warehouse" ในหน้าต่างเงื่อนไข
# เพื่อเปิดหน้าเลือกคลังสินค้า
#
# ต่อยอดจาก flows/r14_102_generate.yaml (เปิด R14.102 + กดสร้างรายงาน) ไม่ต้องเขียนซ้ำ
#
# ปุ่มดินสออยู่ในฟอร์มเงื่อนไข pbdw125 id=1000 ซึ่งเป็น DataWindow วาดเอง ไม่ใช่ control จริง
# จึงต้องคลิกพิกัด วัดจากภาพ 01_condition_dialog แล้วลบตำแหน่งของ DataWindow ออก
#     หน้าต่างเงื่อนไข   rect (27,107) ขนาด 758x516
#     pbdw125 id=1000   rect (36,176) ขนาด 741x441   -> ห่างจากมุมหน้าต่าง (9, 69)
#     ไอคอนดินสอในภาพ   x 345-365  y 98-119          -> ในระบบ DataWindow x 336-356  y 29-50
#     กลางไอคอน = (346, 39)
#
# ปุ่มดินสออื่นในฟอร์มเดียวกัน (กลางไอคอน ในระบบ DataWindow) เผื่อใช้ภายหลัง
#     กลุ่มสินค้า (708, 65)    สินค้า (708, 93)    Lot No (708, 167)
#
# ตำแหน่งหน้าต่างเงื่อนไขบนจอไม่คงที่ (แต่ละรอบเด้งคนละที่) แต่ไม่กระทบ เพราะพิกัดข้างบน
# นับจากมุมของ DataWindow เอง
#
# หน้าต่างที่เด้งขึ้นมา (FNWNS3125 title='เลือกคลังสินค้าที่ต้องการ' ขนาด 376x450)
#     pbdw125 id=1003   รายการคลังแบบ checkbox (DataWindow วาดเอง ต้องคลิกพิกัด)
#         All (หัวตาราง)
#         อนิน สาขาแยกชากค้อ        -> Warehouse, Front Store
#         อ่อนนุช                   -> Main ONN
#         ตลาดเวิลด์มาร์เก็ต          -> Main WRD
#         กรุงเทพกรีฑา              -> Main KTK
#         เก้ากิโล                   -> Main KKL
#         อนิน สาขาสวนเสือศรีราชา    -> Main SSS
#         ตอนเปิดขึ้นมาไม่มีช่องไหนถูกติ๊กเลย (แม้หน้าเงื่อนไขจะแสดงว่าเลือก Warehouse อยู่)
#     { class_name: "Button", title: "ตกลง" }   ยืนยัน
#     { class_name: "Button", title: "ออก" }    ยกเลิก

name: r14_102_warehouse
description: กดปุ่มดินสอหลังคลัง อนิน สาขาแยกชากค้อ:Warehouse เพื่อเปิดหน้าเลือกคลัง
on_error: abort

steps:
  - action: run_flow
    name: เปิด R14.102 แล้วกดสร้างรายงาน
    path: flows/r14_102_generate.yaml

  - action: wait_window
    name: จับหน้าต่างเงื่อนไขไว้อ้างอิง
    as: cond
    timeout: 60
    window:
      class_name: "FNWNS3125"
      title: "เงื่อนไขการสร้างรายงาน"

  - action: dw_click
    name: กดปุ่มดินสอหลังคลัง อนิน สาขาแยกชากค้อ:Warehouse
    window: cond
    datawindow: { class_name: "pbdw125", control_id: 1000 }
    at: { x: 346, y: 39 }

  # ปุ่มดินสอเปิดหน้าต่างใหม่ จึงยืนยันผลด้วย wait_window แทนการเทียบภาพ
  # แน่นอนกว่าเพราะยึดจากชื่อหน้าต่างจริงที่โปรแกรมสร้าง ถ้าคลิกพลาดเป้าจะหมดเวลาแล้วล้ม
  - action: wait_window
    name: รอหน้าต่างเลือกคลังสินค้า
    as: wh
    timeout: 30
    window:
      class_name: "FNWNS3125"
      title: "เลือกคลังสินค้าที่ต้องการ"
    abort_if: { class_name: "#32770" }

  - action: screenshot
    name: 01_warehouse_picker
    window: wh
