# เลือกเงื่อนไขวันที่แบบ "ประจำปี-ช่วงปี" แล้วใส่ช่วงปี 2023-2026
#
# ต่อยอดจาก flows/r14_102_warehouse_select.yaml (ติ๊กคลัง 3 กลุ่มแล้วกดตกลง) ไม่ต้องเขียนซ้ำ
#
# ฟอร์มเงื่อนไข pbdw125 id=1000 เป็น DataWindow วาดเอง ต้องคลิกพิกัด
# วัดจากภาพหน้าเงื่อนไข แล้วลบตำแหน่งของ DataWindow ออก (ห่างจากมุมหน้าต่าง 9, 69)
#
#     ปุ่มวงกลม (x 15-27 ในระบบ DataWindow กลางวง x = 21)
#         ประจำวัน                          y = 95     <- ค่าเริ่มต้น
#         ประจำปี-ช่วงปี                     y = 360    <- เลือกตัวนี้
#     ช่องกรอกปีใต้ "ประจำปี-ช่วงปี"         x 50-334  y 376-397  คลิกกลางช่อง (151, 386)
#         in-place editor ที่โผล่มาคือ Edit id=14 (ค่าเดิมเป็นปีปัจจุบัน)
#         รับรูปแบบช่วงปี "2023-2026" ได้ ทดสอบแล้วไม่มีกล่องเตือน

name: r14_102_year
description: เลือกเงื่อนไขวันที่ ประจำปี-ช่วงปี แล้วใส่ช่วงปี 2023-2026
on_error: abort

steps:
  - action: run_flow
    name: เลือกคลัง 3 กลุ่มแล้วกดตกลง
    path: flows/r14_102_warehouse_select.yaml

  - action: wait_window
    name: จับหน้าต่างเงื่อนไขไว้อ้างอิง
    as: cond
    timeout: 60
    window:
      class_name: "FNWNS3125"
      title: "เงื่อนไขการสร้างรายงาน"

  # ยืนยันที่ปุ่มวงกลม "ประจำวัน" (ตัวที่ถูกเลือกอยู่เดิม) ว่าจุดทึบหายไป ไม่ดูที่ปุ่มที่คลิก
  # เพราะถ้าคลิกแค่ทำให้ช่องได้โฟกัสแต่ไม่เปลี่ยนค่า ภาพตรงจุดที่คลิกอาจเปลี่ยนจนเป็นผลบวกลวง
  # ปุ่มวงกลมเปลี่ยนจากเลือกเป็นไม่เลือก = ต่างกันราว 145 pixel จึงตั้ง change_min_pixels: 60
  - action: dw_click
    name: เลือก ประจำปี-ช่วงปี
    window: cond
    datawindow: { class_name: "pbdw125", control_id: 1000 }
    at: { x: 21, y: 360 }
    expect_change: true
    change_region: { left: 10, right: 32, top: 84, bottom: 106 }   # ปุ่มวงกลม ประจำวัน
    change_min_pixels: 60

  # method: chars ล้างค่าเดิม (ปีปัจจุบัน) ให้ก่อนพิมพ์ แล้วอ่านค่ากลับมาตรวจว่าตรง
  # expect_edit กันคลิกพลาดไปโดนช่องอื่นแล้วพิมพ์ลงผิดช่อง
  - action: dw_edit
    name: ใส่ช่วงปี 2023-2026
    window: cond
    datawindow: { class_name: "pbdw125", control_id: 1000 }
    at: { x: 151, y: 386 }
    expect_edit: 14
    value: "2023-2026"
    method: chars
    then_key: TAB
    pause: 1

  # ถ้าโปรแกรมไม่รับค่าที่ใส่ จะเด้งกล่องเตือนขึ้นมา ตรงนี้ให้ล้มทันทีแทนที่จะไปติดตอนหลัง
  # (ไม่เจอกล่องเตือน = ผ่านทันที ถ้าเจอแล้วไม่มีใครปิด = หมดเวลาแล้วล้ม)
  - action: wait_window_gone
    name: ตรวจว่าไม่มีกล่องเตือนหลังยืนยันค่าปี
    window: { class_name: "#32770" }
    timeout: 2

  - action: screenshot
    name: 01_year_range
    window: cond
